name: Patch automations real auto search
on:
  push:
    branches:
      - feat/automations-real-auto-search
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped patch
        run: python .github/scripts/patch_automations_real.py
      - name: Validate frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit changes if any
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/automations/AutomationsPage.tsx src/components/automations/AutomationCard.tsx
          git commit -m "feat: load real auto search automations"
          git push
