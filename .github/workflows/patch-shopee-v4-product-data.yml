name: Patch Shopee v4 product data

on:
  push:
    branches:
      - fix/shopee-v4-product-data
    paths:
      - '.github/workflows/patch-shopee-v4-product-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shopee-v4-product-data
      - name: Patch Shopee v4 product resolver
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Validate
        run: |
          node --check server/server.js
          npm run test:monitor --prefix server
          npm run test:api --prefix server
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: use Shopee v4 product endpoint and payload"
          git push origin HEAD:fix/shopee-v4-product-data
