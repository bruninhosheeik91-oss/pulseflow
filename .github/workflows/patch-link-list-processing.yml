name: Patch link list real processing
on:
  push:
    branches:
      - feat/link-list-real-processing
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped patch
        run: python .github/scripts/patch_link_list_processing.py
      - name: Validate backend and frontend
        run: |
          node --check server/server.js
          node --check server/linkConversion/tenantLinkListsStore.js
          npm ci
          npm run lint
          npm run build
      - name: Commit changes if any
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/components/linkList/LinkListPage.tsx
          git commit -m "feat: process link lists with real Shopee API"
          git push
