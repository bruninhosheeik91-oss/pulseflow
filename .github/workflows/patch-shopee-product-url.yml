name: Patch Shopee product URL resolver

on:
  push:
    branches:
      - fix/shopee-product-url-resolution
    paths:
      - '.github/workflows/patch-shopee-product-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shopee-product-url-resolution
      - name: Patch product URL resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')
          start_marker = "function extractShopeeUrlProductRef(rawUrl) {\n"
          end_marker = "\n// Resolve dados REAIS do produto pela Affiliate Open API."
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('extractor alvo nao encontrado')
          replacement = '''function extractShopeeUrlProductRef(rawUrl) {
  let parsed;
  try {
    parsed = new URL(rawUrl);
  } catch {
    return null;
  }

  // A Shopee usa pelo menos dois formatos canônicos reais no Brasil:
  // 1) /titulo-i.<shopId>.<itemId>
  // 2) /product/<shopId>/<itemId>
  // Shortlinks podem terminar em qualquer um deles após o redirect.
  let shopId = null;
  let itemId = null;
  let slug = '';

  const slugMatch = parsed.pathname.match(/-i\.(\d+)\.(\d+)/i);
  if (slugMatch) {
    shopId = Number(slugMatch[1]);
    itemId = Number(slugMatch[2]);
    slug = parsed.pathname.replace(/-i\.\d+\.\d+.*$/i, '');
  } else {
    const productMatch = parsed.pathname.match(/\/product\/(\d+)\/(\d+)(?:\/|$)/i);
    if (productMatch) {
      shopId = Number(productMatch[1]);
      itemId = Number(productMatch[2]);
      slug = String(itemId);
    }
  }

  if (!Number.isFinite(itemId)) return null;

  const itemTokens = new Set([itemId]);
  if (Number.isFinite(shopId)) itemTokens.add(shopId);

  if (slug && slug !== String(itemId)) {
    slug = slug.replace(/^\/+|\/+$/g, '');
    try {
      slug = decodeURIComponent(slug);
    } catch {
      // mantém slug cru
    }
    slug = slug.replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  return {
    itemTokens,
    itemId,
    shopId,
    slug: (slug || String(itemId)).slice(0, 60),
  };
}
'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check server/server.js
          npm run test:monitor --prefix server
          npm run test:api --prefix server
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: support Shopee product canonical URL format"
          git push origin HEAD:fix/shopee-product-url-resolution
