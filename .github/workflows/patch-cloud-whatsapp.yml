name: Patch cloud WhatsApp backend
on:
  push:
    branches:
      - feat/cloud-whatsapp-backend
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped patch
        run: python .github/scripts/patch_cloud_whatsapp.py
      - name: Validate backend
        run: |
          node --check server/server.js
          cd server
          npm ci
      - name: Validate container build
        run: docker build -t pulseflow-whatsapp ./server
      - name: Commit changes if any
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "feat: prepare WhatsApp backend for cloud runtime"
          git push
