name: Patch WPP browser cleanup race v2
on:
  push:
    branches:
      - fix/wpp-browser-cleanup-race
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped patch
        run: python -c "import base64;exec(base64.b64decode('')))"
      - name: Validate server syntax and monitor tests
        run: |
          node --check server/server.js
          cd server
          npm ci
          npm run test:monitor
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: wait for WPP browser cleanup before retry"
          git push
