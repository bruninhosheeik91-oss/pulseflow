name: Patch monitor bare author

on:
  push:
    branches:
      - fix/monitor-bare-author-alias
    paths:
      - '.github/workflows/patch-monitor-bare-author.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monitor-bare-author-alias
      - name: Patch bare author aliases
        run: python -c "import base64; exec(base64.b64decode('...TRUNCATED_FOR_BREVITY...').decode())"
      - name: Validate
        run: |
          node --check server/server.js
          npm run test:monitor --prefix server
          npm run test:api --prefix server
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: resolve bare monitor author through PN/LID aliases"
          git push origin HEAD:fix/monitor-bare-author-alias
