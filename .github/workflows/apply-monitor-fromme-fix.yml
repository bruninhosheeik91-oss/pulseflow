name: Apply monitor fromMe admin fix

on:
  push:
    branches:
      - fix/monitor-fromme-admin
    paths:
      - '.github/workflows/apply-monitor-fromme-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monitor-fromme-admin
      - name: Patch fromMe admin validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')
          old = """    const authorNumber = canonicalNumber(canonical.authorId);\n    if (!authorNumber || !adminNumbers.has(authorNumber)) {\n      monitorLog(sessionId, 'autor não autorizado');\n      return;\n    }\n    monitorLog(sessionId, 'autor validado (admin do grupo mãe)');\n"""
          new = """    // Mensagens enviadas pela própria conta podem chegar no onAnyMessage\n    // com `author` em formato LID, diferente do número retornado por\n    // getGroupAdmins(). Para fromMe, a identidade confiável é a própria\n    // conta conectada (devicePhone), obtida via getHostDevice().\n    if (canonical.fromMe === true && !monClient.devicePhone && typeof monClient.getHostDevice === 'function') {\n      await refreshHostDevice(getSessionState(sessionId));\n    }\n    const sessionState = getSessionState(sessionId);\n    const actorId = canonical.fromMe === true\n      ? sessionState.devicePhone\n      : canonical.authorId;\n    const authorNumber = canonicalNumber(actorId);\n    if (!authorNumber || !adminNumbers.has(authorNumber)) {\n      monitorLog(sessionId, 'autor não autorizado');\n      return;\n    }\n    monitorLog(\n      sessionId,\n      canonical.fromMe === true\n        ? 'autor validado (conta conectada é admin do grupo mãe)'\n        : 'autor validado (admin do grupo mãe)'\n    );\n"""
          if old not in s:
              raise SystemExit('bloco alvo não encontrado; abortando sem alterar')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate syntax
        run: node --check server/server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: validate fromMe with connected account identity"
          git push origin HEAD:fix/monitor-fromme-admin
