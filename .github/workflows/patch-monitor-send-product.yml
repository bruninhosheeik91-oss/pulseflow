name: Patch monitor send and product resolution

on:
  push:
    branches:
      - fix/monitor-send-product-resolution
    paths:
      - '.github/workflows/patch-monitor-send-product.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monitor-send-product-resolution

      - name: Patch monitor send and product resolution
        shell: python
        run: |
          from pathlib import Path

          api = Path('server/linkConversion/shopeeApiClient.js')
          s = api.read_text(encoding='utf-8')
          old = """    await rememberShortLinkTarget(cleanSourceUrl);\n    return { affiliateUrl: shortLink.trim() };\n"""
          new = """    await rememberShortLinkTarget(cleanSourceUrl);\n    return {\n      affiliateUrl: shortLink.trim(),\n      resolvedSourceUrl: lookupResolvedSourceUrl(cleanSourceUrl) || null,\n    };\n"""
          if old not in s:
              raise SystemExit('shopeeApiClient alvo não encontrado')
          api.write_text(s.replace(old, new, 1), encoding='utf-8')

          server = Path('server/server.js')
          s = server.read_text(encoding='utf-8')
          old = """  let affiliateUrl = null;\n  try {\n    const result = await client.generateShortLink({ sourceUrl, subIds });\n    affiliateUrl = result && result.affiliateUrl ? result.affiliateUrl : null;\n  } catch (err) {\n"""
          new = """  let affiliateUrl = null;\n  let resolvedSourceUrl = null;\n  try {\n    const result = await client.generateShortLink({ sourceUrl, subIds });\n    affiliateUrl = result && result.affiliateUrl ? result.affiliateUrl : null;\n    resolvedSourceUrl =\n      result && typeof result.resolvedSourceUrl === 'string'\n        ? result.resolvedSourceUrl\n        : null;\n  } catch (err) {\n"""
          if old not in s:
              raise SystemExit('bloco generateShortLink não encontrado')
          s = s.replace(old, new, 1)

          old = """  const offer = { affiliateUrl };\n  const product = await resolveMonitorProduct(client, sourceUrl);\n"""
          new = """  const offer = { affiliateUrl };\n  const productSourceUrl = resolvedSourceUrl || sourceUrl;\n  const product = await resolveMonitorProduct(client, productSourceUrl);\n"""
          if old not in s:
              raise SystemExit('bloco resolveMonitorProduct não encontrado')
          s = s.replace(old, new, 1)

          old = """      const result = offer.imageUrl\n        ? await sendProductWithMedia(st.client, child, message, offer.imageUrl)\n        : await st.client.sendText(child, message);\n      if (result && result.messageId) sentIds.push(result.messageId);\n"""
          new = """      const result = offer.imageUrl\n        ? await sendProductWithMedia(st.client, child, message, offer.imageUrl)\n        : await st.client.sendText(child, message);\n      const sentId =\n        (result && result.messageId) ||\n        (result && result.id && (result.id._serialized || result.id.id)) ||\n        null;\n      if (sentId) sentIds.push(sentId);\n      else if (result) sentIds.push('sent-without-id');\n"""
          if old not in s:
              raise SystemExit('bloco envio não encontrado')
          server.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Validate
        run: |
          node --check server/server.js
          node --check server/linkConversion/shopeeApiClient.js
          npm run test:monitor --prefix server
          npm run test:api --prefix server

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/linkConversion/shopeeApiClient.js
          git commit -m "fix: resolve Shopee product source and count sends correctly"
          git push origin HEAD:fix/monitor-send-product-resolution
