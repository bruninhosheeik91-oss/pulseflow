name: Apply shortlink product resolver fix

on:
  push:
    branches:
      - fix/resolve-shopee-shortlink-product
    paths:
      - '.github/workflows/apply-shortlink-product-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resolve-shopee-shortlink-product
          fetch-depth: 0

      - name: Patch server resolver
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('server/server.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('// Extrai de uma URL de produto Shopee os ids do item')
          end = text.index('// Converte UMA única URL Shopee do Grupo Mãe', start)

          replacement = r'''// Expande shortlinks oficiais da Shopee seguindo apenas redirects HTTP.
// Não faz scraping de HTML. Se a expansão falhar, mantém a URL original e o
// fluxo continua com segurança (sem inventar dados do produto).
async function resolveShopeeSourceUrl(rawUrl, fetchImpl = fetch) {
  let parsed;
  try {
    parsed = new URL(rawUrl);
  } catch {
    return rawUrl;
  }

  const host = parsed.hostname.toLowerCase();
  const isShortLink =
    host.startsWith('s.shopee.') || host === 'shp.ee' || host.endsWith('.shp.ee');
  if (!isShortLink) return rawUrl;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetchImpl(rawUrl, {
      method: 'GET',
      redirect: 'follow',
      signal: controller.signal,
      headers: {
        'User-Agent':
          'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
      },
    });
    const resolved =
      response && typeof response.url === 'string' && response.url.trim()
        ? response.url.trim()
        : rawUrl;
    if (response && response.body && typeof response.body.cancel === 'function') {
      try {
        await response.body.cancel();
      } catch {
        // Corpo não é necessário: só precisamos da URL final do redirect.
      }
    }
    return resolved;
  } catch {
    return rawUrl;
  } finally {
    clearTimeout(timer);
  }
}

// Extrai os ids reais do produto em formatos conhecidos da Shopee:
//   /slug-i.<shopId>.<itemId>
//   /product/<shopId>/<itemId>
// e também query params shopid/itemid quando existirem.
function extractShopeeUrlProductRef(rawUrl) {
  let parsed;
  try {
    parsed = new URL(rawUrl);
  } catch {
    return null;
  }

  let shopId = null;
  let itemId = null;
  let slug = '';

  const canonical = parsed.pathname.match(/-i\.(\d+)\.(\d+)/i);
  if (canonical) {
    shopId = Number(canonical[1]);
    itemId = Number(canonical[2]);
    slug = parsed.pathname
      .replace(/-i\.\d+\.\d+.*$/i, '')
      .replace(/^\/+|\/+$/g, '');
  }

  if (itemId === null) {
    const productPath = parsed.pathname.match(/\/product\/(\d+)\/(\d+)/i);
    if (productPath) {
      shopId = Number(productPath[1]);
      itemId = Number(productPath[2]);
    }
  }

  if (itemId === null) {
    const queryShop = parsed.searchParams.get('shopid') || parsed.searchParams.get('shopId');
    const queryItem = parsed.searchParams.get('itemid') || parsed.searchParams.get('itemId');
    if (/^\d+$/.test(queryItem || '')) itemId = Number(queryItem);
    if (/^\d+$/.test(queryShop || '')) shopId = Number(queryShop);
  }

  if (itemId === null) return null;

  try {
    slug = decodeURIComponent(slug);
  } catch {
    // mantém o slug cru
  }
  slug = slug.replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim();

  return {
    itemId,
    shopId,
    slug: slug ? slug.slice(0, 80) : '',
  };
}

// Resolve dados REAIS do produto pela Affiliate Open API. Para shortlinks,
// primeiro segue o redirect oficial da Shopee para recuperar a URL canônica;
// em seguida usa o slug real na busca e confirma estritamente pelo itemId.
async function resolveMonitorProduct(shopeeClient, rawUrl) {
  const resolvedUrl = await resolveShopeeSourceUrl(rawUrl);
  const ref = extractShopeeUrlProductRef(resolvedUrl);
  if (!ref || !ref.slug) return null;

  let nodes = [];
  try {
    const result = await shopeeClient.productOfferV2({
      keyword: ref.slug,
      limit: 5,
    });
    nodes = Array.isArray(result.nodes) ? result.nodes : [];
  } catch {
    return null;
  }

  for (const node of nodes) {
    const product = normalizeShopeeNode(node);
    if (!product || product.itemId === null || product.itemId === undefined) {
      continue;
    }
    if (Number(product.itemId) === Number(ref.itemId)) return product;
  }
  return null;
}

'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validate syntax and monitor tests
        run: |
          node --check server/server.js
          npm run test:monitor --prefix server

      - name: Commit patched server and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-shortlink-product-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js .github/workflows/apply-shortlink-product-fix.yml
          git commit -m 'fix: resolve Shopee shortlinks before product lookup'
          git push origin HEAD:fix/resolve-shopee-shortlink-product
