name: Patch channels anti-flood v3
on:
  push:
    branches: [feat/channels-antiflood]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python -c "import base64;exec(base64.b64decode(''));"
      - name: Validate
        run: node --check server/server.js && npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/components/channels/ChannelsPage.tsx
          git commit -m "feat: apply real channel anti-flood"
          git push