name: Patch monitor admin aliases

on:
  push:
    branches:
      - fix/monitor-admin-aliases
    paths:
      - '.github/workflows/patch-monitor-admin-aliases.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monitor-admin-aliases
      - name: Patch admin identity aliases
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Validate
        run: |
          node --check server/server.js
          npm run test:monitor --prefix server
          npm run test:api --prefix server
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: match monitor admins across PN and LID aliases"
          git push origin HEAD:fix/monitor-admin-aliases
