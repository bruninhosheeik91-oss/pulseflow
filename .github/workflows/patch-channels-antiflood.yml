name: Patch channels anti-flood
on:
  push:
    branches:
      - feat/channels-antiflood
jobs:
  patch:
    if: github.event.head_commit.message != 'feat: apply real channel anti-flood'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply scoped patch
        run: python -c "import base64;exec(base64.b64decode(''));"
      - name: Validate server syntax
        run: node --check server/server.js
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js src/components/channels/ChannelsPage.tsx
          git commit -m "feat: apply real channel anti-flood"
          git push