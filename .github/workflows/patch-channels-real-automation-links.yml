name: Patch channels real automation links
on:
  push:
    branches:
      - feat/channels-real-automation-links
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply scoped patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          page = 'src/components/channels/ChannelsPage.tsx'
          drawer = 'src/components/channels/ChannelDetailDrawer.tsx'

          replace_once(
              page,
              "} from '../../services/whatsApp/groupConfigStore';\nimport { ChannelsHeader } from './ChannelsHeader';",
              "} from '../../services/whatsApp/groupConfigStore';\nimport {\n  getCurrentTenantId,\n  listAutoSearchAutomations,\n} from '../../services/affiliatePrograms/affiliateProgramsService';\nimport { ChannelsHeader } from './ChannelsHeader';"
          )

          replace_once(
              page,
              "function channelFromRealGroup(\n  account: WhatsAppAccount,\n  group: WhatsAppGroup\n): DistributionChannel {",
              "function channelFromRealGroup(\n  account: WhatsAppAccount,\n  group: WhatsAppGroup,\n  linkedAutomationNames: string[] = []\n): DistributionChannel {"
          )

          replace_once(page, "    linkedCampaigns: [],", "    linkedCampaigns: linkedAutomationNames,")

          replace_once(
              page,
              "    const provider = getWhatsAppProvider();\n    if (!provider) throw new Error('Provedor WhatsApp não configurado.');\n\n    const accounts = await provider.listAccounts();",
              "    const provider = getWhatsAppProvider();\n    if (!provider) throw new Error('Provedor WhatsApp não configurado.');\n\n    const tenantId = getCurrentTenantId();\n    const linkedAutomations = tenantId\n      ? await listAutoSearchAutomations(tenantId).catch(() => [])\n      : [];\n\n    const accounts = await provider.listAccounts();"
          )

          replace_once(
              page,
              "          return groups.map((group) => channelFromRealGroup(account, group));",
              "          return groups.map((group) => {\n            const linkedAutomationNames = linkedAutomations\n              .filter(\n                (automation) =>\n                  automation.destination.accountId === account.sessionId &&\n                  automation.destination.groupIds.includes(group.id)\n              )\n              .map((automation) => automation.name);\n            return channelFromRealGroup(account, group, linkedAutomationNames);\n          });"
          )

          p = Path(drawer)
          text = p.read_text(encoding='utf-8')
          text = text.replace('Campanhas Vinculadas', 'Automações Vinculadas')
          text = text.replace('Campanhas Alimentando Este Canal', 'Automações Alimentando Este Canal')
          text = text.replace('Nenhuma campanha vinculada a este canal no momento.', 'Nenhuma automação vinculada a este canal no momento.')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit changes if any
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/channels/ChannelsPage.tsx src/components/channels/ChannelDetailDrawer.tsx
          git commit -m "feat: show real automations linked to channels"
          git push
