name: Patch Shopee product URL resolver

on:
  push:
    branches:
      - fix/shopee-product-url-resolution
    paths:
      - '.github/workflows/patch-shopee-product-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shopee-product-url-resolution
      - name: Patch product URL resolver
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Validate
        run: |
          node --check server/server.js
          npm run test:monitor --prefix server
          npm run test:api --prefix server
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git commit -m "fix: support Shopee product canonical URL format"
          git push origin HEAD:fix/shopee-product-url-resolution
